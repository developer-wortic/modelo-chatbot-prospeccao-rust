[package]
name = "chatbot-prospeccao"
version = "1.0.0"
edition = "2024"
description = "Modelo da Wortic: chatbot simples de prospecção em Rust, com a sua chave (BYOK) de OpenAI, Anthropic, Gemini, Groq ou OpenRouter"
license-file = "LICENSE"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
toml = "0.8"
ureq = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
